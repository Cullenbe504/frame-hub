<meta name="claude:viewport-fit-sides" content="cover">
<title>Frame Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* layout: full-bleed photo backdrop behind glanceable info clusters pinned to the corners, dark scrim for legibility, always-on ambient-display aesthetic */
  :root{
    --ink:#0b0c0f;
    --paper:#f5f1e8;
    --accent:#e8a33d;
    --glass:rgba(11,12,15,.55);
    --glass-border:rgba(245,241,232,.14);
    --mute:rgba(245,241,232,.62);
    --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    overflow:hidden;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  .stage{
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  .photo{
    position:absolute;
    inset:-3%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 2.2s ease;
    animation:kenburns 22s ease-in-out infinite;
  }
  .photo.active{opacity:1;}
  @keyframes kenburns{
    0%{transform:scale(1.0);}
    50%{transform:scale(1.06);}
    100%{transform:scale(1.0);}
  }
  @media (prefers-reduced-motion:reduce){
    .photo{animation:none;}
  }

  .scrim{
    position:fixed;
    inset:0;
    background:
      linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.18) 26%, rgba(0,0,0,0) 46%),
      linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 22%);
    pointer-events:none;
  }

  .layer{
    position:fixed;
    inset:0;
    padding-top:max(22px, env(safe-area-inset-top,0px));
    padding-bottom:max(22px, env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    pointer-events:none;
  }
  .layer > *{pointer-events:auto;}

  /* top row */
  .top-row{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    gap:14px;
  }

  .weather{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:20px;
    padding:12px 18px;
  }
  .weather svg{width:38px;height:38px;flex:none;}
  .weather-readout{display:flex;flex-direction:column;line-height:1.15;}
  .weather-temp{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    font-variant-numeric:tabular-nums;
  }
  .weather-sub{
    font-size:12px;
    color:var(--mute);
    white-space:nowrap;
  }

  .gear{
    width:42px;height:42px;flex:none;
    border-radius:50%;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;
    opacity:.55;
    transition:opacity .2s ease, transform .2s ease;
    cursor:pointer;
  }
  .gear:hover,.gear:focus-visible{opacity:1; transform:rotate(25deg);}
  .gear svg{width:20px;height:20px;}

  /* bottom row */
  .bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }

  .clock-block{min-width:0;}
  .time{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(56px, 12vw, 128px);
    line-height:1;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 28px rgba(0,0,0,.35);
  }
  .time .ampm{
    font-size:.32em;
    font-weight:700;
    margin-left:10px;
    color:var(--mute);
    vertical-align:middle;
  }
  .date{
    font-size:clamp(15px,2.4vw,20px);
    color:var(--mute);
    font-weight:500;
    margin-top:6px;
  }

  .agenda{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:20px;
    padding:16px 20px;
    min-width:220px;
    max-width:min(340px, 46vw);
  }
  .agenda-title{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mute);
    margin-bottom:10px;
  }
  .agenda-list{display:flex;flex-direction:column;gap:9px;}
  .agenda-item{display:flex;gap:10px;align-items:baseline;font-size:14px;}
  .agenda-time{
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    font-weight:600;
    flex:none;
    width:68px;
  }
  .agenda-label{color:var(--paper);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .agenda-empty{color:var(--mute);font-size:13px;}

  /* settings modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
  }
  .modal-overlay[hidden]{display:none!important;}
  .modal{
    width:min(480px, 100%);
    max-height:min(620px, 86vh);
    overflow-y:auto;
    background:#17181c;
    border:1px solid var(--glass-border);
    border-radius:22px;
    padding:24px;
    color:var(--paper);
  }
  .modal h2{
    font-family:var(--font-display);
    font-size:19px;
    margin:0 0 18px;
    font-weight:700;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--mute);
    margin-bottom:8px;
  }
  .field input[type=text]{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid var(--glass-border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--paper);
    font-family:var(--font-body);
    font-size:14px;
  }
  .field input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .city-results{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .city-result{
    text-align:left;
    background:rgba(255,255,255,.05);
    border:1px solid transparent;
    border-radius:8px;
    padding:8px 10px;
    color:var(--paper);
    font-size:13px;
    cursor:pointer;
    font-family:var(--font-body);
  }
  .city-result:hover,.city-result:focus-visible{border-color:var(--accent);}
  .city-current{font-size:13px;color:var(--mute);margin-top:6px;}

  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{
    flex:1;
    padding:9px 0;
    border-radius:9px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,.05);
    color:var(--mute);
    font-family:var(--font-body);
    font-size:13px;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--accent);
    color:#1a1203;
    border-color:var(--accent);
    font-weight:600;
  }

  .list-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .list-row{
    display:flex;gap:8px;align-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid var(--glass-border);
    border-radius:10px;
    padding:8px 10px;
  }
  .list-row input[type=text]{
    background:transparent;border:none;color:var(--paper);font-size:13px;font-family:var(--font-body);
    min-width:0;flex:1;padding:2px;
  }
  .list-row input[type=text]:focus{outline:none;}
  .list-row .agenda-time-input{flex:none;width:64px;}
  .row-remove{
    flex:none;width:24px;height:24px;border-radius:50%;
    background:rgba(255,255,255,.08);border:none;color:var(--mute);
    cursor:pointer;font-size:14px;line-height:1;
  }
  .row-remove:hover{color:var(--paper);background:rgba(255,255,255,.16);}

  .add-btn{
    width:100%;
    padding:9px 0;
    border-radius:9px;
    border:1px dashed var(--glass-border);
    background:transparent;
    color:var(--mute);
    font-family:var(--font-body);
    font-size:13px;
    cursor:pointer;
    margin-bottom:4px;
  }
  .add-btn:hover{color:var(--paper);border-color:var(--paper);}

  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
  }
  .btn{
    padding:10px 18px;
    border-radius:10px;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .btn-ghost{background:rgba(255,255,255,.07);color:var(--paper);}
  .btn-ghost:hover{background:rgba(255,255,255,.13);}
  .btn-primary{background:var(--accent);color:#1a1203;}
  .btn-primary:hover{filter:brightness(1.08);}

  @media (max-width:520px){
    .bottom-row{flex-direction:column;align-items:flex-start;}
    .agenda{max-width:100%; width:100%;}
    .weather-sub{display:none;}
  }
</style>

<div class="stage" id="stage"></div>
<div class="scrim"></div>

<div class="layer">
  <div class="top-row">
    <div class="weather" id="weatherCard">
      <svg id="weatherIcon" viewBox="0 0 24 24" fill="none"></svg>
      <div class="weather-readout">
        <span class="weather-temp" id="weatherTemp">--°</span>
        <span class="weather-sub" id="weatherSub">Loading weather…</span>
      </div>
    </div>
    <button class="gear" id="gearBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="bottom-row">
    <div class="clock-block">
      <div class="time" id="timeDisplay">--:--</div>
      <div class="date" id="dateDisplay">—</div>
    </div>
    <div class="agenda">
      <div class="agenda-title">Today</div>
      <div class="agenda-list" id="agendaList"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2>Display settings</h2>

    <div class="field">
      <label for="citySearch">Weather location</label>
      <input type="text" id="citySearch" placeholder="Search a city…">
      <div class="city-results" id="cityResults"></div>
      <div class="city-current" id="cityCurrent"></div>
    </div>

    <div class="field">
      <label>Clock format</label>
      <div class="toggle-row">
        <button class="toggle-btn" id="fmt12" type="button">12-hour</button>
        <button class="toggle-btn" id="fmt24" type="button">24-hour</button>
      </div>
    </div>

    <div class="field">
      <label>Agenda</label>
      <div class="list-rows" id="agendaRows"></div>
      <button class="add-btn" id="addAgenda" type="button">+ Add item</button>
    </div>

    <div class="field">
      <label>Photos (paste image URLs, one per line)</label>
      <textarea id="photoUrls" rows="4" style="width:100%;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:10px;padding:10px 12px;color:var(--paper);font-family:var(--font-body);font-size:13px;resize:vertical;"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var DEFAULTS = {
    lat: 29.914, lon: -90.055, city: 'Gretna, LA',
    clockFormat: '12',
    photos: [
      'https://picsum.photos/id/1018/1920/1080',
      'https://picsum.photos/id/1015/1920/1080',
      'https://picsum.photos/id/1043/1920/1080',
      'https://picsum.photos/id/1050/1920/1080',
      'https://picsum.photos/id/1016/1920/1080'
    ],
    agenda: [
      {time:'9:00 AM', label:'Example — Team standup'},
      {time:'1:00 PM', label:'Example — Pick up groceries'},
      {time:'6:30 PM', label:'Example — Dinner with family'}
    ]
  };

  function loadState(){
    try{
      var raw = localStorage.getItem('frameHubState');
      if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
      var parsed = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), parsed);
    }catch(e){
      return JSON.parse(JSON.stringify(DEFAULTS));
    }
  }
  function saveState(state){
    try{ localStorage.setItem('frameHubState', JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();

  /* ---------- clock ---------- */
  var timeEl = document.getElementById('timeDisplay');
  var dateEl = document.getElementById('dateDisplay');

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  function renderClock(){
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var html;
    if(state.clockFormat === '24'){
      html = pad(h) + ':' + pad(m);
    } else {
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12; if(h12 === 0) h12 = 12;
      html = h12 + ':' + pad(m) + '<span class="ampm">' + ampm + '</span>';
    }
    timeEl.innerHTML = html;
    dateEl.textContent = now.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  }
  renderClock();
  setInterval(renderClock, 1000 * 15);
  setInterval(function(){
    // fine-grained tick so minute boundaries don't wait up to 15s
    var now = new Date();
    if(now.getSeconds() === 0) renderClock();
  }, 1000);

  /* ---------- photo slideshow ---------- */
  var stage = document.getElementById('stage');
  var photoEls = [];
  var photoIndex = 0;

  function buildStage(){
    stage.innerHTML = '';
    photoEls = [];
    var list = state.photos && state.photos.length ? state.photos : DEFAULTS.photos;
    list.forEach(function(url){
      var d = document.createElement('div');
      d.className = 'photo';
      d.style.backgroundImage = "url('" + url.replace(/'/g, "%27") + "')";
      stage.appendChild(d);
      photoEls.push(d);
    });
    photoIndex = 0;
    if(photoEls[0]) photoEls[0].classList.add('active');
  }
  buildStage();

  var slideTimer = null;
  function startSlideshow(){
    if(slideTimer) clearInterval(slideTimer);
    if(photoEls.length < 2) return;
    slideTimer = setInterval(function(){
      photoEls[photoIndex].classList.remove('active');
      photoIndex = (photoIndex + 1) % photoEls.length;
      photoEls[photoIndex].classList.add('active');
    }, 20000);
  }
  startSlideshow();

  /* ---------- weather ---------- */
  var weatherIcon = document.getElementById('weatherIcon');
  var weatherTemp = document.getElementById('weatherTemp');
  var weatherSub = document.getElementById('weatherSub');

  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"></circle><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.3M12 19.2v2.3M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></g>',
    cloud: '<path d="M7.5 18a4.3 4.3 0 0 1-.4-8.6 5.3 5.3 0 0 1 10.3-1.7A4.1 4.1 0 0 1 17 18H7.5z" fill="currentColor" opacity=".92"></path>',
    partly: '<circle cx="8" cy="9" r="3.6" fill="currentColor"></circle><path d="M10.5 19a4 4 0 0 1-.3-8 4.9 4.9 0 0 1 9.4-1.4A3.8 3.8 0 0 1 19 19h-8.5z" fill="currentColor" opacity=".92"></path>',
    rain: '<path d="M7.5 14.5a4.3 4.3 0 0 1-.4-8.6 5.3 5.3 0 0 1 10.3-1.7A4.1 4.1 0 0 1 17 14.5H7.5z" fill="currentColor" opacity=".92"></path><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 17.5l-1.3 2.6M13 17.5l-1.3 2.6M17.5 17.5l-1.3 2.6"/></g>',
    storm: '<path d="M7.5 13.5a4.3 4.3 0 0 1-.4-8.6 5.3 5.3 0 0 1 10.3-1.7A4.1 4.1 0 0 1 17 13.5H7.5z" fill="currentColor" opacity=".92"></path><path d="M13 13l-3 5h2.6l-1.6 4 4.6-6h-2.6l1.6-3z" fill="currentColor"></path>',
    snow: '<path d="M7.5 13.5a4.3 4.3 0 0 1-.4-8.6 5.3 5.3 0 0 1 10.3-1.7A4.1 4.1 0 0 1 17 13.5H7.5z" fill="currentColor" opacity=".92"></path><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18v4M9 20l-1.6 1M9 20l1.6 1M15 18v4M15 20l-1.6 1M15 20l1.6 1"/></g>',
    fog: '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14M6 21h12"/></g>'
  };

  function iconForCode(code){
    if(code === 0) return ICONS.sun;
    if(code === 1 || code === 2) return ICONS.partly;
    if(code === 3) return ICONS.cloud;
    if(code === 45 || code === 48) return ICONS.fog;
    if(code >= 51 && code <= 67) return ICONS.rain;
    if(code >= 71 && code <= 77) return ICONS.snow;
    if(code >= 80 && code <= 82) return ICONS.rain;
    if(code >= 85 && code <= 86) return ICONS.snow;
    if(code >= 95) return ICONS.storm;
    return ICONS.cloud;
  }

  function fetchWeather(){
    var lat = state.lat, lon = state.lon;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code,apparent_temperature&daily=temperature_2m_max,temperature_2m_min' +
      '&temperature_unit=fahrenheit&timezone=auto';
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      var cur = data.current;
      var daily = data.daily;
      weatherIcon.innerHTML = iconForCode(cur.weather_code);
      weatherIcon.setAttribute('stroke', 'currentColor');
      weatherIcon.style.color = 'var(--paper)';
      weatherTemp.textContent = Math.round(cur.temperature_2m) + '°';
      var hi = daily ? Math.round(daily.temperature_2m_max[0]) : null;
      var lo = daily ? Math.round(daily.temperature_2m_min[0]) : null;
      var parts = [state.city];
      if(hi !== null && lo !== null) parts.push('H:' + hi + '° L:' + lo + '°');
      weatherSub.textContent = parts.join(' · ');
    }).catch(function(){
      weatherSub.textContent = state.city + ' · weather unavailable';
    });
  }
  fetchWeather();
  setInterval(fetchWeather, 1000 * 60 * 20);

  /* ---------- agenda ---------- */
  var agendaList = document.getElementById('agendaList');
  function renderAgenda(){
    agendaList.innerHTML = '';
    var items = state.agenda || [];
    if(!items.length){
      var empty = document.createElement('div');
      empty.className = 'agenda-empty';
      empty.textContent = 'Nothing on the agenda.';
      agendaList.appendChild(empty);
      return;
    }
    items.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'agenda-item';
      var t = document.createElement('span');
      t.className = 'agenda-time';
      t.textContent = item.time || '';
      var l = document.createElement('span');
      l.className = 'agenda-label';
      l.textContent = item.label || '';
      row.appendChild(t);
      row.appendChild(l);
      agendaList.appendChild(row);
    });
  }
  renderAgenda();

  /* ---------- settings modal ---------- */
  var overlay = document.getElementById('modalOverlay');
  var gearBtn = document.getElementById('gearBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var saveBtn = document.getElementById('saveBtn');
  var citySearch = document.getElementById('citySearch');
  var cityResults = document.getElementById('cityResults');
  var cityCurrent = document.getElementById('cityCurrent');
  var fmt12 = document.getElementById('fmt12');
  var fmt24 = document.getElementById('fmt24');
  var agendaRows = document.getElementById('agendaRows');
  var addAgendaBtn = document.getElementById('addAgenda');
  var photoUrlsField = document.getElementById('photoUrls');

  var draft = null;

  function openModal(){
    draft = JSON.parse(JSON.stringify(state));
    cityCurrent.textContent = 'Currently: ' + draft.city;
    citySearch.value = '';
    cityResults.innerHTML = '';
    setFmtButtons(draft.clockFormat);
    buildAgendaRows();
    photoUrlsField.value = (draft.photos || []).join('\n');
    overlay.hidden = false;
  }
  function closeModal(){ overlay.hidden = true; }

  gearBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

  function setFmtButtons(fmt){
    fmt12.classList.toggle('active', fmt === '12');
    fmt24.classList.toggle('active', fmt === '24');
  }
  fmt12.addEventListener('click', function(){ draft.clockFormat = '12'; setFmtButtons('12'); });
  fmt24.addEventListener('click', function(){ draft.clockFormat = '24'; setFmtButtons('24'); });

  var cityDebounce = null;
  citySearch.addEventListener('input', function(){
    var q = citySearch.value.trim();
    if(cityDebounce) clearTimeout(cityDebounce);
    if(q.length < 2){ cityResults.innerHTML=''; return; }
    cityDebounce = setTimeout(function(){
      fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=5')
        .then(function(r){ return r.json(); })
        .then(function(data){
          cityResults.innerHTML = '';
          (data.results || []).forEach(function(place){
            var btn = document.createElement('button');
            btn.className = 'city-result';
            btn.type = 'button';
            var label = place.name + (place.admin1 ? ', ' + place.admin1 : '') + (place.country ? ', ' + place.country : '');
            btn.textContent = label;
            btn.addEventListener('click', function(){
              draft.lat = place.latitude;
              draft.lon = place.longitude;
              draft.city = place.name + (place.admin1 ? ', ' + place.admin1 : '');
              cityCurrent.textContent = 'Currently: ' + draft.city;
              cityResults.innerHTML = '';
              citySearch.value = '';
            });
            cityResults.appendChild(btn);
          });
        }).catch(function(){});
    }, 350);
  });

  function buildAgendaRows(){
    agendaRows.innerHTML = '';
    (draft.agenda || []).forEach(function(item, idx){
      agendaRows.appendChild(agendaRowEl(item, idx));
    });
  }
  function agendaRowEl(item, idx){
    var row = document.createElement('div');
    row.className = 'list-row';

    var timeInput = document.createElement('input');
    timeInput.type = 'text';
    timeInput.className = 'agenda-time-input';
    timeInput.placeholder = '9:00 AM';
    timeInput.value = item.time || '';
    timeInput.id = 'agendaTime' + idx;
    timeInput.addEventListener('input', function(){ draft.agenda[idx].time = timeInput.value; });

    var labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.placeholder = 'Event name';
    labelInput.value = item.label || '';
    labelInput.id = 'agendaLabel' + idx;
    labelInput.addEventListener('input', function(){ draft.agenda[idx].label = labelInput.value; });

    var remove = document.createElement('button');
    remove.className = 'row-remove';
    remove.type = 'button';
    remove.textContent = '×';
    remove.addEventListener('click', function(){
      draft.agenda.splice(idx, 1);
      buildAgendaRows();
    });

    row.appendChild(timeInput);
    row.appendChild(labelInput);
    row.appendChild(remove);
    return row;
  }
  addAgendaBtn.addEventListener('click', function(){
    draft.agenda = draft.agenda || [];
    draft.agenda.push({time:'', label:''});
    buildAgendaRows();
  });

  saveBtn.addEventListener('click', function(){
    draft.photos = photoUrlsField.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if(!draft.photos.length) draft.photos = DEFAULTS.photos.slice();
    state = draft;
    saveState(state);
    buildStage();
    startSlideshow();
    renderClock();
    renderAgenda();
    fetchWeather();
    closeModal();
  });

  /* ---------- wake lock (best effort, ambient display) ---------- */
  var wakeLock = null;
  function requestWake(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(lock){ wakeLock = lock; }).catch(function(){});
  }
  requestWake();
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') requestWake();
  });
})();
</script>
